            - paragraph [ref=e28]: ¡Hola! Soy Kallpa, tu asesor financiero digital de la Fundación Kallpa. Contame de tu emprendimiento, pues — ¿qué vendés y desde dónde?
            - paragraph [ref=e29]: 12:07
          - generic [ref=e31]:
            - paragraph [ref=e32]: Hola, vendo empanadas desde mi casa en Cochabamba. Hago como 60 por día y las vendo a 6 bolivianos cada una. Pago 350 Bs de alquiler, 90 Bs de luz. La masa me cuesta 1.50 Bs por empanada, el relleno 2 Bs, el aceite 0.50 Bs, la bolsita de entrega 0.30 Bs"
            - paragraph [ref=e33]: 12:08
          - generic [ref=e45]:
            - paragraph [ref=e46]: "¡Qué lindo emprendimiento, pues! Empanadas caseras... ¡eso siempre tiene demanda en Cochabamba! 🥟 Mirá, ya me diste un montón de datos súper valiosos, ¡genial! Dejame ver si entendí bien todo: 📌 Vendés empanadas a **6 Bs** cada una. 📌 Hacés como **60 por día**. 📌 Pagás **350 Bs de alquiler** y **90 Bs de luz** al mes. 📌 Cada empanada te cuesta en materiales: masa (1.50 Bs) + relleno (2 Bs) + aceite (0.50 Bs) + bolsita (0.30 Bs) = **4.30 Bs por empanada**. Ahora, para sacar bien tus números, necesito confirmar una cosita nomás: esos 60 empanadas por día, ¿cuántos días al mes más o menos trabajás? ¿Todos los días, de lunes a sábado, o cómo es tu ritmo?"
            - paragraph [ref=e47]: 12:08
          - generic [ref=e49]:
            - paragraph [ref=e50]: trabajo todos los dias
            - paragraph [ref=e51]: 12:08
          - generic [ref=e53]:
            - paragraph [ref=e54]: "¡Todos los días, pues! Eso sí que es ser trabajadora, ¡te felicito! 💪 Entonces serían 60 empanadas × 30 días = **1,800 empanadas al mes**. ¡Eso es harto! Dejame hacer un resumen rápido de lo que tengo: 🔸 **Lo que ganás:** 1,800 empanadas × 6 Bs = **10,800 Bs al mes** en ventas. 🔸 **Costos que cambian según cuánto producís:** 1,800 × 4.30 Bs = **7,740 Bs al mes** (masa, relleno, aceite, bolsitas). 🔸 **Costos que pagás sí o sí cada mes:** alquiler (350 Bs) + luz (90 Bs) = **440 Bs al mes**. 📊 Tu **ganancia** quedaría así: 10,800 - 7,740 - 440 = **2,620 Bs al mes**. O sea, de cada empanada de 6 Bs, te quedan **1.46 Bs de ganancia limpia**. ¡No está nada mal! Ahora, una preguntita más para afinar bien los números: aparte del alquiler y la luz, ¿pagás algo más cada mes que sea fijo? Por ejemplo, agua, gas para cocinar, transporte, internet... ¿algo así?"
            - paragraph [ref=e55]: 12:09
